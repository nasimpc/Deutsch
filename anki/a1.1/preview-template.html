<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>German A1.1 · 18 study decks</title>
<style>
/* CARD_STYLES */
body { margin:0; background:#eef4fc; color:#16396c; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
main { max-width:1150px; margin:auto; padding:30px 20px; }
h1 { font-size:32px; letter-spacing:-1px; }
p { line-height:1.6; }
.controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:24px 0; }
select,button { font:inherit; padding:10px 14px; border:1px solid #b9d2fa; border-radius:12px; background:white; color:#245edb; }
button { cursor:pointer; }
button:disabled { opacity:.45; cursor:default; }
.faces { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.caption { color:#637b9c; margin:0 0 12px 5px; font-size:13px; }
.status { color:#637b9c; font-size:13px; }
@media(max-width:700px) { .faces { grid-template-columns:1fr; } }
</style>
<main>
<h1>German A1.1</h1>
<p>528 cards · 18 decks · German → English<br>Decks 01–17 contain 30 cards each. Deck 18 contains 18 cards.</p>
<div class="controls"><label>Deck <select id="deck"></select></label><label>Card <select id="card"></select></label><button id="previous">← Previous</button><button id="next">Next →</button></div>
<div class="faces">
<section><p class="caption">Front · German and pronunciation</p><div class="sample-card theme-clean side-front" lang="de"><div class="word" id="german"></div><div class="forms" id="details"></div><div class="sound"><button class="pronounce" id="play" aria-label="Play German pronunciation">▶</button></div><p class="status" id="audio-status" aria-live="polite"></p></div></section>
<section><p class="caption">Back · English</p><div class="sample-card theme-clean side-back" lang="en"><div class="meaning" id="english"></div></div></section>
</div>
<p class="status" id="position"></p>
</main>
<script>
/* DATA */
const byId=id=>document.getElementById(id);
let index=0, audio;
function options(select,items) { select.replaceChildren(...items.map(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;return o;})); }
options(byId('deck'),Array.from({length:18},(_,i)=>[i+1,'Deck '+String(i+1).padStart(2,'0')]));
function render() {
 if(audio) { audio.pause(); audio=null; }
 const c=DATA.cards[index];
 byId('deck').value=c.deck;
 options(byId('card'),DATA.cards.filter(x=>x.deck===c.deck).map(x=>[x.position,x.position-(x.deck-1)*30+' · '+x.headword]));
 byId('card').value=c.position;
 byId('german').textContent=c.headword;
 byId('details').textContent=c.details;
 byId('english').textContent=c.english;
 byId('play').disabled=!DATA.audio[c.audio];
 byId('audio-status').textContent=DATA.audio[c.audio]?'Click to hear German.':'Pronunciation clip awaiting generation.';
 byId('position').textContent='Card '+c.position+' of 528 · Source '+c.source_label;
 byId('previous').disabled=index===0; byId('next').disabled=index===DATA.cards.length-1;
}
byId('deck').onchange=()=>{index=(Number(byId('deck').value)-1)*30;render();};
byId('card').onchange=()=>{index=Number(byId('card').value)-1;render();};
byId('previous').onclick=()=>{if(index>0){index--;render();}};
byId('next').onclick=()=>{if(index<DATA.cards.length-1){index++;render();}};
byId('play').onclick=async()=>{
 if(audio){audio.pause();audio.currentTime=0;}
 audio=new Audio(DATA.audio[DATA.cards[index].audio]);
 try{await audio.play();}catch(e){byId('audio-status').textContent='Audio could not play in this browser.';}
};
render();
</script>
</html>
