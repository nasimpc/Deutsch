<!doctype html>
<!-- First ten Anki cards in the selected clean blue design. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>German A1 · Clean blue cards</title>
<style>
/* CARD_STYLES */
body { margin: 0; background: #eef4fc; color: #16396c; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.page { max-width: 1260px; margin: auto; padding: 42px 36px 50px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: #657e9f; }
h1 { font-family: Georgia,serif; font-size: clamp(32px,5vw,48px); font-weight: 400; letter-spacing: -1.6px; margin: 10px 0; }
.intro { font-size: 15px; color: #637b9c; line-height: 1.6; margin: 0; }
.top { display: flex; justify-content: space-between; align-items: start; gap: 24px; }
button,a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; cursor: pointer; }
button:focus-visible,a:focus-visible { outline: 3px solid #397ef0; outline-offset: 4px; }
.mode { border: 1px solid #c9daf5; background: #fff9; color: #245edb; border-radius: 30px; padding: 11px 16px; white-space: nowrap; }
.cards-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 30px 0; }
.cards-nav button { border-radius: 12px; border: 1px solid #cdddf5; background: #fff8; color: #49638c; min-width: 44px; height: 44px; padding: 0 12px; }
.cards-nav button.selected { background: #245edb; color: white; border-color: #245edb; }
.cards-nav button.has-image::after { content: ' ·'; color: #c49135; font-weight: 900; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px; }
.meta h2 { font-size: 17px; margin: 0; font-weight: 600; }
.download { color: inherit; text-underline-offset: 4px; font-size: 13px; }
.stages { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }
.face-label { font-size: 11px; letter-spacing: 2px; color: #657e9f; text-transform: uppercase; margin: 0 0 14px 3px; }
.stages .sample-card { min-height: 470px; }
.stages .word { font-size: 44px; }
.bottom { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; }
.step { border: 1px solid #c9daf5; color: #245edb; background: transparent; border-radius: 20px; padding: 9px 18px; }
.state { color: #657e9f; font-size: 12px; text-align: center; padding: 0 12px; }
.state.error { color: #b91c1c; }
.night { background: #0b1528; color: #e2edff; }
.night .intro,.night .face-label,.night .state { color: #aac0e0; }
.night .cards-nav button,.night .mode { background: #203454; color: #dce9ff; border-color: #3a5580; }
.night .cards-nav button.selected { background: #377df0; color: white; }
.night .step { color: inherit; border-color: #3a5580; }
@media(max-width:740px) { .page { padding: 25px 18px 40px; } .top { gap: 10px; } .mode { padding: 9px 11px; font-size: 11px; } .stages { grid-template-columns: 1fr; gap: 24px; } .stages .sample-card { min-height: 390px; } .stages .word { font-size: 39px; } .cards-nav { gap: 5px; } .cards-nav button { min-width: 37px; height: 39px; padding: 0 9px; } .meta { align-items: start; } .state { max-width: 180px; line-height: 1.5; } }
</style>
<div class="page">
  <header class="top"><div><div class="eyebrow">German A1 / Clean blue</div><h1>A little German, every day.</h1><p class="intro">First ten cards. Tap the speaker to hear German.<br>Cards marked with a dot include an existing image.</p></div><button class="mode" id="mode" aria-pressed="false">Dark preview</button></header>
  <nav class="cards-nav" id="nav" aria-label="Choose vocabulary card"></nav>
  <div class="meta"><h2>Clean blue</h2><a class="download" href="first-10-clean.apkg" download>Download this Anki sample ↗</a></div>
  <main class="stages"><section><div class="face-label">Front · German + pronunciation</div><div id="front"></div></section><section><div class="face-label">Back · English + optional image</div><div id="back"></div></section></main>
  <div class="bottom"><button class="step" id="previous">← Previous card</button><div class="state" id="state" aria-live="polite"></div><button class="step" id="next">Next card →</button></div>
</div>
<script>
/* PROTOTYPE_DATA */
const url = new URL(location.href);
const variant = 'clean';
let index = Math.min(9,Math.max(0,(parseInt(url.searchParams.get('card'),10)||1)-1));
let currentAudio;
const byId = id => document.getElementById(id);
const escape = s => s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const speaker = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13-4.4v2.1a6 6 0 010 10.6v2.1a8 8 0 000-14.8zm-2 4v6.8a4 4 0 000-6.8z"/></svg>';
function render() {
  if(currentAudio) {currentAudio.pause();currentAudio=null;}
  const card = DATA.cards[index];
  const image = card.image ? '<div class="visual"><img src="'+DATA.assets[card.image]+'" alt="'+escape(card.alt)+'"></div>' : '';
  byId('front').innerHTML = '<div class="sample-card theme-'+variant+' side-front"><div class="word-block"><div class="word">'+escape(card.word)+'</div><div class="forms">'+escape(card.details)+'</div></div><div class="sound"><button class="pronounce" id="play" aria-label="Play German pronunciation">'+speaker+'</button></div></div>';
  byId('back').innerHTML = '<div class="sample-card theme-'+variant+' side-back"><div class="meaning">'+escape(card.english)+'</div>'+image+'</div>';
  byId('play').onclick = async () => {
    if(currentAudio) {currentAudio.pause();currentAudio.currentTime=0;}
    currentAudio = new Audio(DATA.assets[card.audio]);
    try {await currentAudio.play();byId('state').classList.remove('error');}
    catch(error) {byId('state').textContent='Audio could not play. Try the Anki sample.';byId('state').classList.add('error');}
  };
  byId('state').classList.remove('error');
  byId('state').textContent = 'Card '+card.id+' of 10 · '+(card.image?'Image included':'English only on back');
  byId('nav').innerHTML = DATA.cards.map((c,i)=>'<button class="'+(i===index?'selected ':'')+(c.image?'has-image':'')+'" data-card="'+i+'" aria-label="Card '+c.id+': '+escape(c.word)+'" aria-current="'+(i===index?'true':'false')+'">'+String(c.id).padStart(2,'0')+'</button>').join('');
  byId('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{index=Number(b.dataset.card);render();});
  url.searchParams.delete('variant');url.searchParams.set('card',String(index+1));
  try {history.replaceState(null,'',url);} catch(error) { /* Local file previews can restrict history. */ }
}
byId('previous').onclick=()=>{index=(index+9)%10;render();};
byId('next').onclick=()=>{index=(index+1)%10;render();};
byId('mode').onclick=()=>{const dark=document.body.classList.toggle('night');document.body.classList.toggle('nightMode',dark);byId('mode').textContent=dark?'Light preview':'Dark preview';byId('mode').setAttribute('aria-pressed',String(dark));};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable="true"]'))return;if(e.key==='ArrowLeft'){e.preventDefault();index=(index+9)%10;render();}if(e.key==='ArrowRight'){e.preventDefault();index=(index+1)%10;render();}});
render();
</script>
</html>
